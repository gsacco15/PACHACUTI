name: WebGL build & deploy

# Builds the browser slice with GameCI and force-pushes the finished site (index.html + Build/)
# as a single commit to the `webgl-build` branch. The Vercel project deploys that branch
# (Vercel → Settings → Git → Production Branch = webgl-build); Vercel cannot run Unity itself.
# Manual only. Needs repository secrets UNITY_LICENSE (contents of the .ulf), UNITY_EMAIL and
# UNITY_PASSWORD (see https://game.ci/docs/github/activation).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webgl
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: Pachacuti.EditorTools.SliceBuild.WebGL
          customParameters: -buildPath build/WebGL
      - name: Push the site to the webgl-build branch
        env:
          SOURCE_SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" build   # GameCI's container writes as root
          test -f build/WebGL/index.html
          cd build/WebGL
          git init -q -b webgl-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "WebGL build of ${SOURCE_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" webgl-build
